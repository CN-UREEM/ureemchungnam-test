<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>유림텔레콤 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=SUIT:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{--pink:#FF2E98;--plum:#4D1738;--ink:#21171C;--muted:#82747B;--line:#EAE3E7}
body{margin:0;font-family:'SUIT',sans-serif;background:#F7F4F6;color:var(--ink)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:
radial-gradient(circle at 15% 10%,rgba(255,46,152,.10),transparent 28%),
linear-gradient(135deg,#fff 0%,#F8F4F6 55%,#F2EAF0 100%)}
.panel{width:min(430px,100%);background:#fff;border:1px solid #eee7eb;border-radius:28px;padding:34px;box-shadow:0 25px 70px rgba(77,23,56,.12)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:30px}
.brand-mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--pink),var(--plum));display:grid;place-items:center;color:#fff;font-weight:900;font-size:19px}
.brand strong{display:block;font-size:18px}.brand span{font-size:11px;color:var(--muted)}
h1{font-size:30px;line-height:1.2;letter-spacing:-1.5px;margin:0 0 9px}
.desc{margin:0 0 26px;color:var(--muted);font-size:14px;line-height:1.6}
label{display:block;font-size:12px;font-weight:800;margin:0 0 7px}
input{width:100%;height:52px;border:1px solid var(--line);border-radius:14px;padding:0 15px;font:inherit;font-size:14px;outline:none;transition:.18s;background:#fff}
input:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,46,152,.08)}
.field{margin-bottom:16px}
button{width:100%;height:54px;border:0;border-radius:15px;background:var(--plum);color:#fff;font:inherit;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 12px 28px rgba(77,23,56,.18)}
button:hover{background:#681f4c}
button:disabled{opacity:.55;cursor:wait}
.msg{min-height:20px;margin-top:13px;text-align:center;font-size:12px;color:#D62D68}
.note{margin-top:24px;padding-top:18px;border-top:1px solid #F0EAED;color:#9A8C93;font-size:11px;line-height:1.6}
@media(max-width:520px){.panel{padding:26px 20px;border-radius:22px}h1{font-size:27px}}
</style>
</head>
<body>
<main class="login">
<section class="panel">
<div class="brand"><div class="brand-mark">U+</div><div><strong>UREEM TELECOM</strong><span>ADMINISTRATOR</span></div></div>
<h1>관리자 로그인</h1>
<p class="desc">상담 신청과 고객 문의를 안전하게 관리하세요.</p>

<form id="loginForm">
<div class="field">
<label for="email">관리자 이메일</label>
<input id="email" type="email" autocomplete="username" placeholder="admin@example.com" required>
</div>
<div class="field">
<label for="password">비밀번호</label>
<input id="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required>
</div>
<button id="loginBtn" type="submit">관리자 로그인</button>
<div id="msg" class="msg"></div>
</form>

<div class="note">
Supabase Auth를 이용하는 관리자 로그인 화면입니다.<br>
관리자 계정은 Supabase Dashboard에서 먼저 생성해야 합니다.
</div>
</section>
</main>

<script>
const SUPABASE_URL = 'https://ptzbbmevdefnfjjinnie.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_0ioEfZQ2hKnMgczqit1PzA_LGWbxIf0';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const form=document.getElementById('loginForm');
const btn=document.getElementById('loginBtn');
const msg=document.getElementById('msg');

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  msg.textContent='';
  btn.disabled=true;
  btn.textContent='로그인 중...';

  const {error}=await sb.auth.signInWithPassword({
    email:document.getElementById('email').value.trim(),
    password:document.getElementById('password').value
  });

  if(error){
    msg.textContent='이메일 또는 비밀번호를 확인해주세요.';
    btn.disabled=false;
    btn.textContent='관리자 로그인';
    return;
  }

  location.href='./dashboard.html';
});
</script>
</body>
</html>
