<style>
*{box-sizing:border-box}
:root{--pink:#FF2E98;--plum:#4D1738;--ink:#21171C;--muted:#82747B;--line:#EAE3E7;--bg:#F7F4F6;--white:#fff;--yellow:#F59E0B;--blue:#6366F1;--green:#16A34A}
body{margin:0;font-family:'SUIT',sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}
button{cursor:pointer}
.header{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:11px}.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--pink),var(--plum));color:#fff;display:grid;place-items:center;font-weight:900}.brand strong{font-size:16px}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:1px}
.logout{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-weight:700;font-size:12px}.push-btn{border:0;background:var(--pink);color:#fff;border-radius:10px;padding:9px 13px;font-weight:800;font-size:12px}.push-btn.on{background:#16803B}.push-btn:disabled{opacity:.6;cursor:wait}
.wrap{max-width:1180px;margin:auto;padding:30px 22px 70px}
.topline{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}.topline h1{font-size:29px;letter-spacing:-1.5px;margin:0 0 5px}.topline p{margin:0;color:var(--muted);font-size:13px}
.refresh{border:0;background:var(--plum);color:#fff;border-radius:11px;padding:11px 15px;font-weight:800;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px 20px}.stat span{font-size:12px;color:var(--muted);font-weight:700}.stat strong{display:block;font-size:31px;letter-spacing:-1px;margin-top:7px}.stat.today strong{color:var(--plum)}.stat.pending strong{color:var(--yellow)}.stat.progress strong{color:var(--blue)}.stat.done strong{color:var(--green)}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.toolbar{padding:16px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center;justify-content:space-between}.filters{display:flex;gap:8px;flex:1}.search{height:42px;border:1px solid var(--line);border-radius:11px;padding:0 13px;outline:none;width:min(300px,100%)}.search:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,46,152,.08)}.select{height:42px;border:1px solid var(--line);border-radius:11px;padding:0 11px;background:#fff;outline:none}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th{text-align:left;font-size:11px;color:var(--muted);font-weight:800;background:#FCFAFB;padding:13px 16px;border-bottom:1px solid var(--line)}.table td{padding:15px 16px;border-bottom:1px solid #F1ECEF;font-size:13px;vertical-align:middle}.table tr:last-child td{border-bottom:0}.name{font-weight:800}.phone{color:var(--muted);font-size:12px}.memo{max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900}.b-wait{background:#FFF7E6;color:#B77900}.b-progress{background:#EEF0FF;color:#4F46E5}.b-done{background:#EAF8EE;color:#16803B}
.status{border:0;padding:6px 8px;border-radius:8px;font-weight:800;font-size:11px;background:#fff7e6;color:#9a6700}.status.progress{background:#eef0ff;color:#4f46e5}.status.done{background:#eaf8ee;color:#16803b}
.empty{padding:55px 20px;text-align:center;color:var(--muted);font-size:13px}.error{padding:15px;background:#FFF1F4;color:#C0264A;font-size:12px;line-height:1.5}
.drawer-bg{display:none;position:fixed;inset:0;background:rgba(33,23,28,.35);z-index:40}.drawer{position:absolute;right:0;top:0;height:100%;width:min(440px,94vw);background:#fff;padding:25px;overflow:auto;box-shadow:-20px 0 50px rgba(0,0,0,.12)}.drawer-bg.open{display:block}.drawer-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#f5f1f3;border-radius:9px;width:34px;height:34px}.detail-label{font-size:11px;color:var(--muted);font-weight:800;margin-top:20px}.detail-value{font-size:15px;font-weight:700;margin-top:5px}.detail-memo{margin-top:7px;background:#F8F5F7;border-radius:12px;padding:13px;font-size:13px;line-height:1.6;white-space:pre-wrap}.status-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.status-actions button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 4px;font-size:11px;font-weight:800}.status-actions button.active{background:var(--plum);color:#fff;border-color:var(--plum)}
.loading{padding:45px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:760px){.header{height:64px;padding:0 15px}.wrap{padding:22px 14px 70px}.topline{align-items:flex-start}.topline h1{font-size:25px}.refresh{padding:9px 11px}.stats{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:15px;border-radius:15px}.stat strong{font-size:27px}.toolbar{display:block}.filters{display:grid;grid-template-columns:1fr 120px;margin-bottom:8px}.search{width:100%}.select{width:100%}.panel{border-radius:16px}.table th,.table td{padding:12px 13px}.brand strong{font-size:14px}.logout{font-size:11px;padding:8px 10px}}

.period-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 20px}
.period-summary>div{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px 16px}
.period-summary span{display:block;color:var(--muted);font-size:10px;font-weight:800}
.period-summary strong{display:block;font-size:20px;margin-top:5px;letter-spacing:-.5px}
@media(max-width:760px){.period-summary{grid-template-columns:repeat(2,1fr);gap:8px}.period-summary>div{padding:13px}.toolbar .refresh{width:100%;margin-top:8px}}
.activity-log{margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#FCFAFB}.activity-item{padding:10px 12px;border-bottom:1px solid #F0EAED;font-size:11px;line-height:1.5}.activity-item:last-child{border-bottom:0}.activity-item strong{font-size:12px}.activity-item small{display:block;color:var(--muted);margin-top:2px}
.header-right{display:flex;align-items:center;gap:10px}
.online{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:900;letter-spacing:.6px;color:#16803B}
.online i{width:7px;height:7px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 4px rgba(34,197,94,.10)}
.eyebrow{font-size:10px;font-weight:900;letter-spacing:1.3px;color:var(--pink);margin-bottom:7px}
.section-title,.panel-title{display:flex;justify-content:space-between;align-items:end;margin:0 0 10px;padding:0 3px}
.section-title strong,.panel-title strong{font-size:15px;letter-spacing:-.4px}
.section-title span,.panel-title span{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.panel-title{padding:17px 18px 0;margin-bottom:0}
.panel-title strong{font-size:17px}
.panel-title span{font-size:11px}
.stat{position:relative;overflow:hidden}
.stat:after{content:"";position:absolute;width:75px;height:75px;border-radius:50%;right:-28px;bottom:-34px;background:rgba(255,46,152,.045)}
.stat.today:after{background:rgba(77,23,56,.06)}
.stat.pending:after{background:rgba(245,158,11,.07)}
.stat.progress:after{background:rgba(99,102,241,.07)}
.stat.done:after{background:rgba(22,163,74,.07)}
.toolbar{background:#FCFAFB}
@media(max-width:760px){
 .header-right{gap:6px}.online{display:none}
 .topline{padding-top:4px}
 .section-title{margin-top:2px}
 .panel-title{padding:15px 14px 0}
}
</style>

<body>
<header class="header">
  <div class="brand"><div class="mark">U+</div><div><strong>UREEM TELECOM</strong><small>ADMIN CONSOLE</small></div></div>
  <div class="header-right"><span class="online"><i></i> LIVE</span><button class="push-btn" id="pushBtn">🔔 알림 켜기</button><button class="logout" id="logoutBtn">로그아웃</button></div>
</header>

<main class="wrap">
  <div class="topline">
    <div><div class="eyebrow">UREEM TELECOM · ADMIN</div><h1>안녕하세요, 관리자님 👋</h1><p>오늘 들어온 상담과 진행 현황을 한눈에 확인하세요.</p></div>
    <button class="refresh" id="refreshBtn">↻ 데이터 새로고침</button>
  </div>

    <div class="stat today"><span>오늘 접수</span><strong id="todayCount">-</strong></div>
    <div class="stat pending"><span>상담 대기</span><strong id="pendingCount">-</strong></div>
    <div class="stat progress"><span>상담 진행</span><strong id="progressCount">-</strong></div>
    <div class="stat done"><span>상담 완료</span><strong id="doneCount">-</strong></div>
  </section>

  <section class="period-summary">
    <div><span id="periodLabel">전체 기간</span><strong id="periodTotal">0건</strong></div>
    <div><span>완료율</span><strong id="periodRate">0%</strong></div>
    <div><span>인터넷 + TV</span><strong id="periodTv">0건</strong></div>
    <div><span>인터넷 단독</span><strong id="periodInternet">0건</strong></div>
  </section>

  <section class="panel">
    <div class="panel-title"><div><strong>상담 신청</strong><span>고객 문의를 확인하고 상담 상태를 관리하세요.</span></div></div>
    <div class="toolbar">
      <div class="filters">
        <input id="search" class="search" placeholder="이름, 전화번호, 상품, 메모 검색">
        <select id="statusFilter" class="select">
          <option value="all">전체 상태</option>
          <option value="대기">상담 대기</option>
          <option value="상담중">상담 중</option>
          <option value="완료">상담 완료</option>
        </select>
        <select id="periodFilter" class="select">
          <option value="all">전체 기간</option>
          <option value="today">오늘</option>
          <option value="week">이번 주</option>
          <option value="month">이번 달</option>

      </div>
      <button class="refresh" id="exportBtn">↓ 엑셀 다운로드</button>
    </div>

</main>

<div id="drawerBg" class="drawer-bg">
  <aside class="drawer">
    <div class="drawer-head"><h2 style="margin:0;font-size:21px">상담 상세</h2><button class="close" id="closeDrawer">×</button></div>
    <div id="detail"></div>
  </aside>
</div>

<script>
const SUPABASE_URL='https://ptzbbmevdefnfjjinnie.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_0ioEfZQ2hKnMgczqit1PzA_LGWbxIf0';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let rows=[];
let selected=null;

const isNativeApp = navigator.userAgent.includes('UREEM_CSM_APP');

function esc(v){
  return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function badge(s){
  if(s==='완료') return '<span class="badge b-done">상담 완료</span>';
  if(s==='상담중') return '<span class="badge b-progress">상담 중</span>';
  return '<span class="badge b-wait">상담 대기</span>';
}
function dateText(v){
  const d=new Date(v);
  return isNaN(d)?'-':d.toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function renderStats(){
  const now=new Date(); const y=now.getFullYear(), m=now.getMonth(), d=now.getDate();
  const today=rows.filter(r=>{const x=new Date(r.created_at);return x.getFullYear()===y&&x.getMonth()===m&&x.getDate()===d}).length;
  document.getElementById('todayCount').textContent=today;
  document.getElementById('pendingCount').textContent=rows.filter(r=>(r.status||'대기')==='대기').length;
  document.getElementById('progressCount').textContent=rows.filter(r=>r.status==='상담중').length;
  document.getElementById('doneCount').textContent=rows.filter(r=>r.status==='완료').length;
}
function renderPeriodSummary(period){
  const now=new Date(), start=new Date(now); start.setHours(0,0,0,0);
  let label='전체 기간';
  if(period==='today') label='오늘';
  if(period==='week'){label='이번 주';const day=start.getDay();start.setDate(start.getDate()-(day===0?6:day-1));}
  if(period==='month'){label='이번 달';start.setDate(1);}
  const list=period==='all'?rows:rows.filter(r=>new Date(r.created_at)>=start);
  const done=list.filter(r=>r.status==='완료').length;
  const tv=list.filter(r=>String(r.product||'').includes('TV')).length;
  const internet=list.filter(r=>String(r.product||'').includes('인터넷')&&!String(r.product||'').includes('TV')).length;
  document.getElementById('periodLabel').textContent=label;
  document.getElementById('periodTotal').textContent=list.length+'건';
  document.getElementById('periodRate').textContent=(list.length?Math.round(done/list.length*100):0)+'%';
  document.getElementById('periodTv').textContent=tv+'건';
  document.getElementById('periodInternet').textContent=internet+'건';
}

function renderTable(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const f=document.getElementById('statusFilter').value;
  const p=document.getElementById('periodFilter').value;
  const now=new Date();
  const start=new Date(now); start.setHours(0,0,0,0);
  if(p==='week'){const day=start.getDay(); start.setDate(start.getDate()-(day===0?6:day-1));}
  if(p==='month'){start.setDate(1);}
  const list=rows.filter(r=>{
    const text=[r.name,r.phone,r.current_carrier,r.product,r.memo,r.admin_note].join(' ').toLowerCase();
    const dt=new Date(r.created_at);
    const periodOk=p==='all'||dt>=start;
    return periodOk&&(!q||text.includes(q))&&(f==='all'||(r.status||'대기')===f);
  });
  renderPeriodSummary(p);
  if(!list.length){document.getElementById('tableArea').innerHTML='<div class="empty">조건에 맞는 상담 신청이 없습니다.</div>';return;}
  document.getElementById('tableArea').innerHTML=`<div class="table-wrap"><table class="table">
  <thead><tr><th>접수일</th><th>고객</th><th>통신사</th><th>관심상품</th><th>메모</th><th>상태</th></tr></thead>
  <tbody>${list.map(r=>`<tr data-id="${r.id}" style="cursor:pointer">
  <td>${dateText(r.created_at)}</td><td><div class="name">${esc(r.name)}</div><div class="phone">${esc(r.phone)}</div></td>
  <td>${esc(r.current_carrier||'-')}</td><td>${esc(r.product||'-')}</td><td><div class="memo">${esc(r.memo||'-')}</div></td>
  <td>${badge(r.status||'대기')}</td></tr>`).join('')}</tbody></table></div>`;
  document.querySelectorAll('tbody tr').forEach(tr=>tr.addEventListener('click',()=>openDetail(Number(tr.dataset.id))));
}
const VAPID_PUBLIC_KEY='BLkU7WdFwGg4ERux1eqAkgeWkrpcqTVh5TM8XmFaheQa4sPVdrgpdGL1EKfcJWTLBB96MDUeuPUdT38kqF4JduI';

function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const rawData=atob(base64);
  return Uint8Array.from([...rawData].map(ch=>ch.charCodeAt(0)));
}

async function getPushRegistration(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) throw new Error('이 브라우저는 Web Push를 지원하지 않습니다.');
  return await navigator.serviceWorker.register('./sw.js');
}

async function enableWebPush(){
if(isNativeApp) return;

  const btn=document.getElementById('pushBtn');
  btn.disabled=true;
  try{
    if(!window.isSecureContext) throw new Error('HTTPS 환경에서만 알림을 사용할 수 있습니다.');
    const permission=await Notification.requestPermission();
    if(permission!=='granted') throw new Error('브라우저 알림 권한이 허용되지 않았습니다.');
    const {data:{session}}=await sb.auth.getSession();
    if(!session?.user?.id) throw new Error('관리자 로그인 세션이 없습니다.');
    const reg=await getPushRegistration();
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});
    }
    const json=sub.toJSON();
    const endpoint=sub.endpoint;
    const p256dh=json.keys?.p256dh;
    const auth=json.keys?.auth;
    if(!endpoint||!p256dh||!auth) throw new Error('브라우저 Push 구독 정보를 읽지 못했습니다.');
    const {error}=await sb.from('push_subscriptions').upsert({
      user_id:session.user.id,
      endpoint,
      p256dh,
      auth
    },{onConflict:'endpoint'});
    if(error) throw error;
    btn.textContent='🔔 알림 켜짐';
    btn.classList.add('on');
    btn.disabled=false;
    localStorage.setItem('ureem_push_enabled','1');
  }catch(err){
    console.error('Web Push 등록 실패:',err);
    alert(err?.message||'알림 설정에 실패했습니다.');
    btn.disabled=false;
  }
}

async function syncPushButton(){
  const btn=document.getElementById('pushBtn');

console.log('NATIVE APP:', isNativeApp, navigator.userAgent);

if(isNativeApp){
  btn.textContent='📱 앱 알림 정상 작동';
  btn.classList.add('on');
  btn.disabled=true;
  return;
}

  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)){btn.textContent='🔕 미지원';btn.disabled=true;return;}
    const reg=await getPushRegistration();
    const sub=await reg.pushManager.getSubscription();
    if(sub && Notification.permission==='granted'){
      btn.textContent='🔔 알림 켜짐';
      btn.classList.add('on');
    }
  }catch(e){console.warn('Push 상태 확인 실패',e);}
}

document.getElementById('pushBtn').addEventListener('click',enableWebPush);

async function load(){
  const {data,error}=await sb.from('internet_consultations').select('*').order('created_at',{ascending:false});
  if(error){
    document.getElementById('tableArea').innerHTML='<div class="error"><b>상담 데이터를 불러오지 못했습니다.</b><br>Supabase RLS에서 로그인한 관리자에게 SELECT 권한이 있는지 확인해주세요.</div>';
    return;
  }
  rows=data||[]; renderStats(); renderTable();
}
function openDetail(id){
  selected=rows.find(r=>r.id===id); if(!selected)return;
  const s=selected.status||'대기';
  document.getElementById('detail').innerHTML=`
  <div class="detail-label">고객명</div><div class="detail-value">${esc(selected.name)}</div>
  <div class="detail-label">연락처</div><div class="detail-value">${esc(selected.phone)}</div>
  <div class="detail-label">현재 통신사</div><div class="detail-value">${esc(selected.current_carrier||'-')}</div>
  <div class="detail-label">관심 상품</div><div class="detail-value">${esc(selected.product||'-')}</div>
  <div class="detail-label">접수일</div><div class="detail-value">${dateText(selected.created_at)}</div>
  <div class="detail-label">고객 메모</div><div class="detail-memo">${esc(selected.memo||'작성된 메모가 없습니다.')}</div><div class="detail-label">상담 직원 메모</div>
  <textarea id="adminNote" style="width:100%;min-height:110px;margin-top:7px;border:1px solid #EAE3E7;border-radius:12px;padding:12px;font:inherit;font-size:13px;resize:vertical;outline:none" placeholder="상담 내용, 방문 예정일, 결합 조건 등을 기록하세요.">${esc(selected.admin_note||'')}</textarea>
  <button id="saveNote" style="width:100%;margin-top:8px;border:0;background:#4D1738;color:#fff;border-radius:10px;padding:11px;font-weight:800">상담 메모 저장</button>
  <a href="tel:${esc(selected.phone).replace(/[^0-9+]/g,'')}" style="display:flex;align-items:center;justify-content:center;width:100%;margin-top:8px;text-decoration:none;background:#FF2E98;color:#fff;border-radius:10px;padding:11px;font-weight:800;font-size:13px">📞 ${esc(selected.phone)} 전화하기</a>
  <div class="detail-label">상담 상태</div>
  <div class="status-actions">
    <button class="${s==='대기'?'active':''}" data-status="대기">상담 대기</button>
    <button class="${s==='상담중'?'active':''}" data-status="상담중">상담 중</button>
    <button class="${s==='완료'?'active':''}" data-status="완료">상담 완료</button>
  </div>
  <div class="detail-label">상담 활동 이력</div>
  <div id="activityLog" class="activity-log"><div class="loading" style="padding:18px">이력을 불러오는 중...</div></div>`;
  document.querySelectorAll('.status-actions button').forEach(b=>b.addEventListener('click',()=>updateStatus(b.dataset.status)));
  loadActivityLog(selected.id);
  document.getElementById('saveNote').addEventListener('click',saveAdminNote);
  document.getElementById('drawerBg').classList.add('open');
}
async function saveAdminNote(){
  if(!selected)return;
  const note=document.getElementById('adminNote').value.trim();
  const btn=document.getElementById('saveNote');
  btn.disabled=true; btn.textContent='저장 중...';
  const {error}=await sb.from('internet_consultations').update({admin_note:note}).eq('id',selected.id);
  if(error){alert('메모 저장에 실패했습니다. admin_note 컬럼과 UPDATE 권한을 확인해주세요.');btn.disabled=false;btn.textContent='상담 메모 저장';return;}
  selected.admin_note=note;
  const i=rows.findIndex(r=>r.id===selected.id);if(i>=0)rows[i].admin_note=note;
  btn.disabled=false;btn.textContent='저장 완료 ✓';
  setTimeout(()=>{if(btn)btn.textContent='상담 메모 저장'},1200);
}

async function loadActivityLog(id){
  const box=document.getElementById('activityLog'); if(!box)return;
  const {data,error}=await sb.from('consultation_logs').select('*').eq('consultation_id',id).order('created_at',{ascending:false});
  if(error){box.innerHTML='<div class="activity-item">활동 이력을 불러오지 못했습니다.</div>';return;}
  if(!data?.length){box.innerHTML='<div class="activity-item" style="color:#82747B">아직 기록된 활동이 없습니다.</div>';return;}
  box.innerHTML=data.map(x=>`<div class="activity-item"><strong>${esc(x.action||'활동')}</strong><small>${esc(x.actor_email||'관리자')} · ${dateText(x.created_at)}</small>${x.detail?`<div>${esc(x.detail)}</div>`:''}</div>`).join('');
}

async function updateStatus(status){
  if(!selected)return;
  const {error}=await sb.from('internet_consultations').update({status}).eq('id',selected.id);
  if(error){alert('상태 변경에 실패했습니다. RLS UPDATE 권한을 확인해주세요.');return;}
  const oldStatus=selected.status||'대기';
  selected.status=status;
  const i=rows.findIndex(r=>r.id===selected.id); if(i>=0)rows[i].status=status;
  const session=(await sb.auth.getSession()).data.session;
  await sb.from('consultation_logs').insert({consultation_id:selected.id,action:'상담 상태 변경',detail:`${oldStatus} → ${status}`,actor_email:session?.user?.email||'관리자'});
  renderStats(); renderTable(); openDetail(selected.id);
}
document.getElementById('search').addEventListener('input',renderTable);
document.getElementById('statusFilter').addEventListener('change',renderTable);
document.getElementById('periodFilter').addEventListener('change',renderTable);
document.getElementById('exportBtn').addEventListener('click',()=>{
  const headers=['접수일','고객명','연락처','현재 통신사','관심상품','고객 메모','직원 메모','상태'];
  const rowsOut=rows.map(r=>[
    new Date(r.created_at).toLocaleString('ko-KR'),r.name,r.phone,r.current_carrier,r.product,r.memo,r.admin_note,r.status||'대기'
  ]);
  const csv='\uFEFF'+[headers,...rowsOut].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='유림텔레콤_상담신청_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href);
});

document.getElementById('refreshBtn').addEventListener('click',load);
document.getElementById('closeDrawer').addEventListener('click',()=>document.getElementById('drawerBg').classList.remove('open'));
document.getElementById('drawerBg').addEventListener('click',e=>{if(e.target.id==='drawerBg')e.currentTarget.classList.remove('open')});
document.getElementById('logoutBtn').addEventListener('click',async()=>{
  try{
    const reg=await navigator.serviceWorker.getRegistration('./');
    const sub=await reg?.pushManager.getSubscription();
    if(sub) await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint);
  }catch(e){console.warn('Push 구독 정리 실패',e);}
  await sb.auth.signOut();
  location.href='./';
});

(async()=>{
  const {data}=await sb.auth.getSession();
  if(!data.session){location.href='./유림텔레콤_관리자페이지_v1_로그인_키입력완료.html';return;}
  await load();
  await syncPushButton();
})();
</script>
</body>
