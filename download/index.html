<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>충남담당 CSM 앱 설치</title>
  <meta name="description" content="충남담당 CSM 관리자 전용 Android 앱">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: #f5f7fa; color: #111827;
    }
    body {
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .app { width: 100%; max-width: 430px; }
    .card {
      background: #fff; border-radius: 28px; padding: 42px 28px 30px;
      text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.08);
    }
    .logo {
      width: 92px; height: 92px; margin: 0 auto 22px; border-radius: 24px;
      background: #fff; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 25px rgba(0,0,0,.08); overflow: hidden;
    }
    .logo img { width: 100%; height: 100%; object-fit: contain; }
    .title { margin: 0; font-size: 29px; font-weight: 900; letter-spacing: -1.2px; }
    .subtitle { margin: 9px 0 0; color: #6b7280; font-size: 15px; line-height: 1.6; }
    .features { margin: 30px 0; display: grid; gap: 10px; text-align: left; }
    .feature {
      display: flex; align-items: center; gap: 13px; padding: 15px 16px;
      background: #f8fafc; border-radius: 15px; font-size: 15px; font-weight: 700;
    }
    .icon {
      width: 38px; height: 38px; flex: 0 0 38px; border-radius: 11px;
      background: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 20px; box-shadow: 0 3px 10px rgba(0,0,0,.05);
    }
    .download {
      display: block; width: 100%; padding: 17px 20px; border-radius: 15px;
      background: #111827; color: #fff; text-decoration: none; font-size: 17px;
      font-weight: 800; letter-spacing: -.3px;
    }
    .download:hover { opacity: .9; transform: translateY(-1px); }
    .version { margin-top: 17px; font-size: 13px; color: #9ca3af; }
    .notice {
      margin-top: 25px; padding: 14px 16px; border-radius: 13px;
      background: #f8fafc; color: #6b7280; font-size: 12px; line-height: 1.6;
    }
    .footer { margin-top: 22px; text-align: center; font-size: 11px; color: #9ca3af; }
  </style>
